services:
    _defaults:
        autowire: true
        autoconfigure: true
    App\:
        resource: '../src/'
        exclude: '../src/Kernel.php'
    App\Service\Database:
        arguments:
            $host: '%env(DB_HOST)%'
            $port: '%env(int:DB_PORT)%'
            $name: '%env(DB_NAME)%'
            $user: '%env(DB_USER)%'
            $password: '%env(DB_PASSWORD)%'
    App\Service\Account:
        public: true
        arguments:
            $issuer: '%env(OIDC_ISSUER)%'
            $clientId: '%env(OIDC_CLIENT_ID)%'
            $clientSecret: '%env(OIDC_CLIENT_SECRET)%'
            $appUrl: '%env(APP_URL)%'
    App\Service\GoogleBooks:
        arguments:
            $apiKey: '%env(GOOGLE_BOOKS_API_KEY)%'
    App\Controller\LibraryController:
        arguments:
            $portfolioUrl: '%env(PORTFOLIO_URL)%'
            $atelierUrl: '%env(ATELIER_URL)%'
    App\EventSubscriber\ResponseHeaders:
        arguments:
            $issuer: '%env(OIDC_ISSUER)%'
